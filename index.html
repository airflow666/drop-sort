<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0a14" />
  <meta name="description" content="ВИТРИНКА — сортируй коллекционные фигурки по витринам, открывай блайнд-боксы и собирай сезонные серии." />
  <title>ВИТРИНКА</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0a14;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    #app { width: 100%; height: 100%; position: relative; }
    canvas { display: block; }

    /* Загрузчик живёт в разметке, а не в JS: он должен быть виден до того,
       как распарсится бандл. Убирается из DOM после первого кадра игры. */
    #boot {
      position: absolute; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px;
      background: radial-gradient(120% 90% at 50% 0%, #1c1636 0%, #0b0a14 60%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: opacity .35s ease;
    }
    #boot.hide { opacity: 0; pointer-events: none; }
    /* Логотип загрузчика пишется латиницей: он показывается ДО того, как
       площадка сообщит язык, и латинская форма читается в обеих локалях.
       Как только язык известен, App.start заменяет надпись на локальную. */
    #boot .logo {
      font-size: 10vmin; font-weight: 900; letter-spacing: .16em; line-height: 1;
      background: linear-gradient(105deg, #ff5cf0 0%, #7c5cff 45%, #35e6ff 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: #ff5cf0;
      filter: drop-shadow(0 0 24px rgba(150, 90, 255, .55));
    }
    #boot .bar { width: 46vmin; max-width: 260px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
    #boot .bar i { display: block; height: 100%; width: 30%; border-radius: 3px;
      background: linear-gradient(90deg, #7c5cff, #35e6ff);
      animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%) } 100% { transform: translateX(333%) } }
  </style>
</head>
<body>
  <div id="app">
    <div id="boot">
      <div class="logo">VITRINKA</div>
      <div class="bar"><i></i></div>
    </div>
  </div>
  <!-- SDK Яндекс Игр подключается программно из src/platform/sdk.ts
       (document.createElement + .onload/.onerror как JS-свойства), а не тегом
       в разметке: устойчивее к строгому CSP и без гонки состояний между
       async-загрузкой скрипта и нашим модулем. -->
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
